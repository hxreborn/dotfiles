font_family JetBrainsMono Nerd Font
font_size 10

copy_on_select yes
shell_integration enabled


mouse_map middle release grabbed,ungrabbed paste_from_clipboard

input_delay 1
repaint_delay 2
sync_to_monitor no
wayland_enable_ime no

tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Disable paste confirmation dialog for text with control codes
paste_actions no-op

# Disable close terminal warning
confirm_os_window_close 0

# Ctrl+C: send interrupt signal explicitly (works in raw input mode like Claude Code)
map ctrl+c send_text all \x03

# Ctrl+J: newline in Claude Code (ESC + CR)
map ctrl+j send_text all \x1b\r

# Use kitty's built-in Nerd Font for icons (Nerd Fonts v3.3.0)
# CaskaydiaCove NF has rendering issues - let kitty handle icon sizes
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ed00-U+efc1,U+f000-U+f2ff,U+f000-U+f2e0,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono


# Noctalia auto-generated theme (updates with wallpaper)
include themes/noctalia.conf

# BEGIN_KITTY_THEME
# Noctalia
include current-theme.conf
# END_KITTY_THEME