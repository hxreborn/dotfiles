# Clipboard
clipboard_control write-clipboard write-primary read-clipboard read-primary
env TERM_PROGRAM=kitty

# Font Configuration
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 10

# Window Configuration
window_padding_width 12
background_opacity 1.0
background_blur 32
hide_window_decorations yes

# Cursor Configuration
cursor_shape block
cursor_blink_interval 1
cursor_trail 1

# Scrollback
scrollback_lines 3000

# Terminal features
enable_audio_bell no
copy_on_select yes
strip_trailing_spaces smart

# Disable paste confirmation dialog for text with control codes
paste_actions no-op

# Disable close terminal warning
confirm_os_window_close 0

# Enable socket-only remote control for clip2path
allow_remote_control socket-only

# Latency optimizations
input_delay 1
repaint_delay 2
sync_to_monitor no
wayland_enable_ime no

# Tab configuration
tab_bar_style powerline
tab_bar_align left
tab_powerline_style slanted
tab_title_template {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Key bindings
map ctrl+shift+n new_window
map ctrl+t no_op
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Ctrl+C: send interrupt signal explicitly
map ctrl+c send_text all \x03

# Ctrl+V passes to app unmodified. cc reads clipboard images via wl-paste.
# Ctrl+Shift+V saves image to /tmp and pastes path (github.com/anthropics/claude-code/issues/834)
map ctrl+shift+v launch --type=background --allow-remote-control --keep-focus ~/.local/bin/clip2path

# Ctrl+J: newline in cc (ESC + CR)
map ctrl+j send_text all \x1b\r

mouse_map middle release grabbed,ungrabbed paste_from_clipboard

# Use kitty's built-in Nerd Font for icons (Nerd Fonts v3.3.0)
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ed00-U+efc1,U+f000-U+f2ff,U+f000-U+f2e0,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

# Shell integration
shell_integration enabled

# Dank color generation
include dank-tabs.conf
include dank-theme.conf


# BEGIN_KITTY_THEME
# Noctalia
include current-theme.conf
# END_KITTY_THEME
