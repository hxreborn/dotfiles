# ── font ──────────────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10

# ── window ────────────────────────────────────────────────────────────────────
window_padding_width     8
background_opacity       0.92
background_blur          32
hide_window_decorations  yes

# ── cursor ────────────────────────────────────────────────────────────────────
cursor_shape                 block
cursor_blink_interval        0
cursor_trail 1

# ── scrollback ────────────────────────────────────────────────────────────────
scrollback_lines 10000

# ── performance ───────────────────────────────────────────────────────────────
input_delay        1
repaint_delay      2
sync_to_monitor    no
wayland_enable_ime no

# ── shell ─────────────────────────────────────────────────────────────────────
shell_integration     enabled
enable_audio_bell     no
copy_on_select        yes
strip_trailing_spaces smart
paste_actions         no-op
confirm_os_window_close 0
allow_remote_control  socket-only
clipboard_control     write-clipboard write-primary read-clipboard read-primary

# ── mouse ─────────────────────────────────────────────────────────────────────
mouse_hide_wait 2.0
mouse_map middle release grabbed,ungrabbed paste_from_clipboard

# ── urls ──────────────────────────────────────────────────────────────────────
url_style   curly
detect_urls yes

# ── key bindings ──────────────────────────────────────────────────────────────
map ctrl+c    send_text all \x03
map ctrl+j    send_text all \x1b\r
map ctrl+plus  change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0    change_font_size all 0
map ctrl+v    launch --type=background --allow-remote-control --keep-focus ~/.local/bin/clip2path

# ── nerd font symbols ─────────────────────────────────────────────────────────
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ed00-U+efc1,U+f000-U+f2ff,U+f000-U+f2e0,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

# ── tabs ──────────────────────────────────────────────────────────────────────
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   slanted
tab_bar_align         left
tab_bar_min_tabs      2
tab_bar_margin_height 2.5 1.5
tab_activity_symbol   " ● "
tab_title_template        "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title[:30]}{title[30:] and '…'} [{index}]"
active_tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title[:30]}{title[30:] and '…'} [{index}]"

# ── theme ─────────────────────────────────────────────────────────────────────
include themes/noctalia.conf

# BEGIN_KITTY_THEME
# Noctalia
include current-theme.conf
# END_KITTY_THEME
